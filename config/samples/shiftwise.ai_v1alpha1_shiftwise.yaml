apiVersion: shiftwise.ai/v1alpha1
kind: ShiftWise
metadata:
  name: shiftwise
  namespace: shiftwise-ai
spec:
  targetNamespace: shiftwise-ai
  images:
    harvester: quay.io/parraes/kubeoptix-harvester:0.2.1
    analyzer: quay.io/parraes/kubeoptix-analyzer:0.2.1
    coreAi: quay.io/parraes/kubeoptix-core-ai:0.2.1
    configurations: quay.io/parraes/kubeoptix-configurations:0.2.1
    reporter: quay.io/parraes/kubeoptix-reporter:0.2.1
    dashboard: quay.io/parraes/kubeoptix-dashboard:0.2.1
  storage:
    name: harvester-app-data
    size: 10Gi
    accessModes:
      - ReadWriteOnce
  credentials:
    existingSecret: kubeoptix-db
    llmExistingSecret: llm
  components:
    harvester:
      enabled: true
    analyzer:
      enabled: true
    coreAi:
      enabled: true
    configurations:
      enabled: true
    reporter:
      enabled: true
    dashboard:
      enabled: true
