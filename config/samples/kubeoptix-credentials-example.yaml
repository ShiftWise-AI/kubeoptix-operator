apiVersion: v1
kind: Secret
metadata:
  name: kubeoptix-db
  namespace: shiftwise-ai
type: Opaque
stringData:
  POSTGRESQL_USER: kubeoptix
  POSTGRESQL_PASSWORD: replace-with-a-strong-password
  POSTGRESQL_DATABASE: kubeoptix
---
apiVersion: v1
kind: Secret
metadata:
  name: llm
  namespace: shiftwise-ai
type: Opaque
stringData:
  CURSOR_API_KEY: ""
  CURSOR_MODEL: default
  LLM_API_KEY: replace-with-your-llm-api-key
  LLM_BASE_URL: https://api.openai.com/v1
  LLM_MODEL: gpt-4o-mini
