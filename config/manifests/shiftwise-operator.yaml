apiVersion: v1
kind: Namespace
metadata:
  name: shiftwise-operator-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shiftwise-operator-controller-manager
  namespace: shiftwise-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shiftwise-operator-manager-role
rules:
  - apiGroups: [""]
    resources: ["namespaces", "services", "serviceaccounts", "secrets", "configmaps", "persistentvolumeclaims", "events", "pods"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["*"]
  - apiGroups: ["autoscaling", "batch"]
    resources: ["horizontalpodautoscalers", "jobs", "cronjobs"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["*"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["*"]
  - apiGroups: ["build.openshift.io"]
    resources: ["buildconfigs"]
    verbs: ["*"]
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams"]
    verbs: ["*"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["*"]
  - apiGroups: ["shiftwise.ai"]
    resources: ["shiftwises", "shiftwises/status", "shiftwises/finalizers"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shiftwise-operator-manager-rolebinding
subjects:
  - kind: ServiceAccount
    name: shiftwise-operator-controller-manager
    namespace: shiftwise-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shiftwise-operator-manager-role
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shiftwise-operator-controller-manager
  namespace: shiftwise-operator-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shiftwise-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shiftwise-operator
    spec:
      serviceAccountName: shiftwise-operator-controller-manager
      containers:
        - name: manager
          image: quay.io/parraes/shiftwise-operator-system:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: RECONCILE_INTERVAL_SECONDS
              value: "30"
            - name: WATCH_NAMESPACE
              value: ""
            - name: OPERATOR_NAME
              value: shiftwise-operator
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["lua", "-e", "require('dkjson')"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["kubectl", "version", "--client"]
            initialDelaySeconds: 15
            periodSeconds: 30
