apiVersion: v1
kind: Secret
metadata:
  name: kubeoptix-db
  namespace: shiftwise-ai
type: Opaque
stringData:
  POSTGRESQL_USER: kubeoptix
  POSTGRESQL_PASSWORD: replace-with-a-strong-password
  POSTGRESQL_DATABASE: kubeoptix
---
apiVersion: v1
kind: Secret
metadata:
  name: llm
  namespace: shiftwise-ai
type: Opaque
stringData:
  CURSOR_API_KEY: ""
  CURSOR_MODEL: default
  LLM_API_KEY: replace-with-your-llm-api-key
  LLM_BASE_URL: https://api.openai.com/v1
  LLM_MODEL: gpt-4o-mini
---
# BuildConfigs expect a basic-auth Secret named github-auth.
# Create it before starting builds:
#   oc create secret generic github-auth \
#     --from-literal=username=x-access-token \
#     --from-literal=password=<GITHUB_TOKEN> \
#     --type=kubernetes.io/basic-auth \
#     -n shiftwise-ai
apiVersion: v1
kind: Secret
metadata:
  name: github-auth
  namespace: shiftwise-ai
type: kubernetes.io/basic-auth
stringData:
  username: x-access-token
  password: replace-with-your-github-token
