name: Publish operator images to Quay

on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source:
        description: Full main merge commit SHA to resume (empty uses current main)
        required: false
        type: string

permissions:
  contents: read

jobs:
  branch-flow:
    uses: ./.github/workflows/branch-limits.yml

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python for release tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install release test dependency
        run: python -m pip install 'PyYAML==6.0.3'

      - name: Test release automation
        run: python -m unittest discover -s hack -p 'test_ci_release.py' -v

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      - name: Validate workflow syntax
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -ignore '^unexpected key "queue" for "concurrency" section\.' .github/workflows/*.yml
          grep -Fqx '      queue: max' .github/workflows/publish-quay.yml
      - name: Set up Python for SAST
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install SAST scanner
        run: python -m pip install 'semgrep==1.181.0'
      - name: Run SAST
        run: semgrep scan --config p/security-audit --error --strict --metrics=off
      - name: Scan dependencies and secrets
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          skip-dirs: .git,.venv,target,node_modules,.cache

  publish:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.ref == 'refs/heads/main'
    needs: [branch-flow, test, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: quay-release
    concurrency:
      group: operator-production-release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      COMPONENT_IMAGE_TAG: '1.0.5'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install bundle generator dependency
        run: python -m pip install 'PyYAML==6.0.3'

      - name: Check credentials before reserving a release
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          for name in QUAY_USERNAME QUAY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing secret $name"
              exit 1
            fi
          done

      - name: Configure release identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Reserve or resume version
        id: release
        env:
          SOURCE: ${{ inputs.source || github.sha }}
        run: python hack/ci-release.py --source "$SOURCE"

      - name: Test exact versioned source
        run: go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Quay
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Load previously published immutable images
        id: existing
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE: ${{ steps.release.outputs.source }}
        run: |
          for kind in operator bundle catalog; do
            image=quay.io/parraes/shiftwise-operator
            tag="$VERSION"
            if [[ "$kind" != operator ]]; then
              image="$image-$kind"
              tag="v$VERSION"
            fi
            if docker manifest inspect "$image:$tag" > /dev/null 2> "$RUNNER_TEMP/manifest-error"; then
              docker pull "$image:$tag"
              revision="$(docker image inspect "$image:$tag" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
              version="$(docker image inspect "$image:$tag" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
              [[ "$revision" == "$SOURCE" && "$version" == "$VERSION" ]] || { echo '::error::Existing image provenance mismatch'; exit 1; }
              docker tag "$image:$tag" "$image:sha-$SOURCE"
              echo "$kind=true" >> "$GITHUB_OUTPUT"
            elif grep -Eqi 'manifest unknown|no such manifest' "$RUNNER_TEMP/manifest-error"; then
              echo "$kind=false" >> "$GITHUB_OUTPUT"
            else
              echo '::error::Cannot query Quay; refusing to overwrite a release'
              exit 1
            fi
          done

      - name: Load published catalog history
        id: catalog
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          catalog_version() {
            python - "$1" "$2" <<'PY'
          import sys
          import yaml

          package = "shiftwise-operator"
          target = tuple(int(part) for part in sys.argv[2].split("."))
          prefix = f"{package}.v"
          for document in yaml.safe_load_all(open(sys.argv[1])):
              if (
                  document
                  and document.get("schema") == "olm.channel"
                  and document.get("package") == package
                  and document.get("name") == "stable"
              ):
                  entries = document.get("entries", [])
                  if entries:
                    previous = [
                      entry["name"][len(prefix):]
                      for entry in entries
                      if entry.get("name", "").startswith(prefix)
                      and tuple(int(part) for part in entry["name"][len(prefix):].split(".")) < target
                    ]
                    if previous:
                      print(max(previous, key=lambda value: tuple(int(part) for part in value.split("."))))
                  break
          PY
          }

          release_version="$VERSION"
          fallback_version="$(catalog_version catalog/shiftwise-operator/catalog.yaml "$release_version")"
          catalog_image=quay.io/parraes/shiftwise-operator-catalog:stable
          if ! docker pull "$catalog_image"; then
            if [[ -z "$fallback_version" ]]; then
              echo "No previous catalog image; keeping the checked-in initial catalog."
              echo "previous_version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            catalog_image="quay.io/parraes/shiftwise-operator-catalog:v${fallback_version}"
            docker pull "$catalog_image"
          fi
          container_id="$(docker create "$catalog_image")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir -p catalog/shiftwise-operator
          docker cp "${container_id}:/configs/shiftwise-operator/catalog.yaml" \
            catalog/shiftwise-operator/catalog.yaml
          docker rm "$container_id" >/dev/null
          trap - EXIT
          previous_version="$(catalog_version catalog/shiftwise-operator/catalog.yaml "$release_version")"
          echo "previous_version=${previous_version}" >> "$GITHUB_OUTPUT"

      - name: Generate OLM bundle and catalog
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.catalog.outputs.previous_version }}
          OPERATOR_IMG: quay.io/parraes/shiftwise-operator:${{ steps.release.outputs.version }}
          BUNDLE_IMG: quay.io/parraes/shiftwise-operator-bundle:v${{ steps.release.outputs.version }}
        run: python hack/generate-olm.py

      - name: Build Operator image without publishing
        if: steps.existing.outputs.operator != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Containerfile
          push: false
          load: true
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            COMPONENT_IMAGE_TAG=${{ env.COMPONENT_IMAGE_TAG }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.source }}
          tags: |
            quay.io/parraes/shiftwise-operator:${{ steps.release.outputs.version }}
            quay.io/parraes/shiftwise-operator:sha-${{ steps.release.outputs.source }}

      - name: Build OLM bundle image without publishing
        if: steps.existing.outputs.bundle != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./bundle.Dockerfile
          push: false
          load: true
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.source }}
          tags: |
            quay.io/parraes/shiftwise-operator-bundle:v${{ steps.release.outputs.version }}
            quay.io/parraes/shiftwise-operator-bundle:sha-${{ steps.release.outputs.source }}

      - name: Build OLM catalog image without publishing
        if: steps.existing.outputs.catalog != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./catalog.Dockerfile
          push: false
          load: true
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.source }}
          tags: |
            quay.io/parraes/shiftwise-operator-catalog:v${{ steps.release.outputs.version }}
            quay.io/parraes/shiftwise-operator-catalog:sha-${{ steps.release.outputs.source }}

      - name: Require non-root executable images
        env:
          SOURCE: ${{ steps.release.outputs.source }}
        run: |
          for image in shiftwise-operator shiftwise-operator-catalog; do
            user="$(docker image inspect "quay.io/parraes/$image:sha-$SOURCE" --format '{{.Config.User}}')"
            if [[ -z "$user" || "${user%%:*}" == '0' || "${user%%:*}" == 'root' ]]; then
              echo "::error::$image must declare a non-root USER."
              exit 1
            fi
          done

      - name: Validate file-based OLM catalog
        env:
          IMAGE: quay.io/parraes/shiftwise-operator-catalog:sha-${{ steps.release.outputs.source }}
        run: docker run --rm --read-only "$IMAGE" validate /configs

      - name: Scan Operator image and runtime configuration
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        env:
          TRIVY_IMAGE_CONFIG_SCANNERS: misconfig,secret
        with:
          version: v0.69.3
          image-ref: quay.io/parraes/shiftwise-operator:sha-${{ steps.release.outputs.source }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false

      - name: Scan non-executable OLM bundle contents
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.69.3
          image-ref: quay.io/parraes/shiftwise-operator-bundle:sha-${{ steps.release.outputs.source }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false

      - name: Scan OLM catalog and runtime configuration
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        env:
          TRIVY_IMAGE_CONFIG_SCANNERS: misconfig,secret
        with:
          version: v0.69.3
          image-ref: quay.io/parraes/shiftwise-operator-catalog:sha-${{ steps.release.outputs.source }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false

      - name: Publish scanned immutable images and verify digests
        id: published
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE: ${{ steps.release.outputs.source }}
          EXISTING: ${{ toJSON(steps.existing.outputs) }}
        run: |
          for kind in operator bundle catalog; do
            image=quay.io/parraes/shiftwise-operator
            tag="$VERSION"
            if [[ "$kind" != operator ]]; then
              image="$image-$kind"
              tag="v$VERSION"
            fi
            if [[ "$(jq -r --arg kind "$kind" '.[$kind]' <<< "$EXISTING")" != true ]]; then
              docker push "$image:$tag"
            fi
            digest="$(docker buildx imagetools inspect "$image:$tag" --format '{{.Manifest.Digest}}')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker pull "$image:$tag@$digest"
            docker tag "$image:$tag@$digest" "$image:sha-$SOURCE"
            docker push "$image:sha-$SOURCE"
            echo "$kind=$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Update current release aliases without rolling back
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE: ${{ steps.release.outputs.source }}
          OPERATOR_DIGEST: ${{ steps.published.outputs.operator }}
          CATALOG_DIGEST: ${{ steps.published.outputs.catalog }}
        run: |
          git fetch origin main --tags
          highest="$(git tag -l 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1)"
          if [[ "$(git rev-parse origin/main)" != "$SOURCE" || "$highest" != "v$VERSION" ]]; then
            echo 'Historical release published; leaving latest and stable unchanged.'
            exit 0
          fi
          docker tag "quay.io/parraes/shiftwise-operator:$VERSION@$OPERATOR_DIGEST" quay.io/parraes/shiftwise-operator:latest
          docker push quay.io/parraes/shiftwise-operator:latest
          [[ "$(docker buildx imagetools inspect quay.io/parraes/shiftwise-operator:latest --format '{{.Manifest.Digest}}')" == "$OPERATOR_DIGEST" ]]
          docker tag "quay.io/parraes/shiftwise-operator-catalog:v$VERSION@$CATALOG_DIGEST" quay.io/parraes/shiftwise-operator-catalog:stable
          docker push quay.io/parraes/shiftwise-operator-catalog:stable
          [[ "$(docker buildx imagetools inspect quay.io/parraes/shiftwise-operator-catalog:stable --format '{{.Manifest.Digest}}')" == "$CATALOG_DIGEST" ]]

  ci-required:
    if: always()
    needs: [branch-flow, test, security, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e --arg event "$GITHUB_EVENT_NAME" '
            .["branch-flow"].result == "success" and
            .security.result == "success" and
            .test.result == "success" and
            (if $event == "push" or $event == "workflow_dispatch" then
              .publish.result == "success"
            else
              .publish.result == "skipped"
            end)
          ' <<< "$RESULTS"