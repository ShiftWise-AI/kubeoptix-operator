apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  name: shiftwise-operator.v0.1.1
  namespace: placeholder
  annotations:
    capabilities: Basic Install
    categories: AI/Machine Learning,OpenShift Optional
    containerImage: quay.io/parraes/shiftwise-operator-system:0.1.0
    createdAt: "2026-08-30T00:00:00Z"
    operators.operatorframework.io/suggested-namespace: shiftwise-operator-system
    alm-examples: |
      [
        {
          "apiVersion": "shiftwise.ai/v1alpha1",
          "kind": "ShiftWise",
          "metadata": {
            "name": "shiftwise",
            "namespace": "shiftwise-ai"
          },
          "spec": {
            "kubeoptix-harvester": {
              "build": {
                "enabled": true,
                "source": {
                  "gitUri": "https://github.com/ShiftWise-AI/kubeoptix-harvester.git",
                  "gitRef": "main"
                }
              }
            },
            "kubeoptix-analyzer": {
              "build": {
                "enabled": true,
                "source": {
                  "gitUri": "https://github.com/ShiftWise-AI/kubeoptix-analyzer.git",
                  "gitRef": "main"
                }
              }
            }
          }
        }
      ]
spec:
  displayName: ShiftWise Operator
  description: Lua operator that reconciles the complete KubeOptix stack, including collection, analysis, configuration, reporting, dashboard, and PostgreSQL.
  keywords:
    - shiftwise
    - openshift
    - kubernetes
    - lua
    - aiops
  maintainers:
    - name: parraes
  provider:
    name: ShiftWise
  maturity: alpha
  minKubeVersion: 1.26.0
  version: 0.1.1
  replaces: shiftwise-operator.v0.1.0
  links:
    - name: ShiftWise Operator
      url: https://github.com/ShiftWise-AI
  icon:
    - mediatype: image/png
      base64data: 
  customresourcedefinitions:
    owned:
      - name: shiftwises.shiftwise.ai
        version: v1alpha1
        kind: ShiftWise
        displayName: ShiftWise
        description: Declarative configuration that provisions and monitors all KubeOptix components.
  install:
    strategy: deployment
    spec:
      permissions: []
      clusterPermissions:
        - serviceAccountName: shiftwise-operator-controller-manager
          rules:
            - apiGroups: [""]
              resources: ["namespaces", "services", "serviceaccounts", "secrets", "configmaps", "persistentvolumeclaims", "events", "pods"]
              verbs: ["*"]
            - apiGroups: ["apps"]
              resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
              verbs: ["*"]
            - apiGroups: ["autoscaling", "batch"]
              resources: ["horizontalpodautoscalers", "jobs", "cronjobs"]
              verbs: ["*"]
            - apiGroups: ["rbac.authorization.k8s.io"]
              resources: ["clusterroles", "clusterrolebindings"]
              verbs: ["*"]
            - apiGroups: ["route.openshift.io", "monitoring.coreos.com"]
              resources: ["routes", "servicemonitors", "podmonitors", "prometheusrules"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["shiftwise.ai"]
              resources: ["shiftwises", "shiftwises/status", "shiftwises/finalizers"]
              verbs: ["*"]
      deployments:
        - name: shiftwise-operator-controller-manager
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: shiftwise-operator
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: shiftwise-operator
              spec:
                serviceAccountName: shiftwise-operator-controller-manager
                containers:
                  - name: manager
                    image: quay.io/parraes/shiftwise-operator-system:0.1.0
                    imagePullPolicy: IfNotPresent
                    env:
                      - name: RECONCILE_INTERVAL_SECONDS
                        value: "30"
                    resources:
                      requests:
                        cpu: 100m
                        memory: 128Mi
                      limits:
                        cpu: 500m
                        memory: 512Mi
  installModes:
    - type: OwnNamespace
      supported: true
    - type: SingleNamespace
      supported: true
    - type: MultiNamespace
      supported: false
    - type: AllNamespaces
      supported: true