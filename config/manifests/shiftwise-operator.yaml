# Combined install for OpenShift: CRD + operator in namespace shiftwise-ai
#   oc apply -f config/manifests/shiftwise-operator.yaml
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shiftwises.shiftwise.ai
  labels:
    app.kubernetes.io/name: shiftwise-operator
    app.kubernetes.io/part-of: kubeoptix
spec:
  group: shiftwise.ai
  names:
    kind: ShiftWise
    listKind: ShiftWiseList
    plural: shiftwises
    singular: shiftwise
    shortNames:
      - sw
    categories:
      - shiftwise
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: string
          jsonPath: .status.readyComponents
        - name: Target
          type: string
          jsonPath: .spec.targetNamespace
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: ShiftWise is the Schema for the shiftwises API.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: ShiftWiseSpec defines the desired state of a ShiftWise platform instance.
              type: object
              properties:
                targetNamespace:
                  description: OpenShift project where KubeOptix components are created.
                  type: string
                  default: shiftwise-ai
                images:
                  type: object
                  properties:
                    harvester:
                      type: string
                    analyzer:
                      type: string
                    coreAi:
                      type: string
                    configurations:
                      type: string
                    reporter:
                      type: string
                    dashboard:
                      type: string
                    postgres:
                      type: string
                storage:
                  type: object
                  properties:
                    existingClaim:
                      type: string
                    name:
                      type: string
                    size:
                      type: string
                    storageClassName:
                      type: string
                    accessModes:
                      type: array
                      items:
                        type: string
                gitSource:
                  type: object
                  properties:
                    existingSecret:
                      type: string
                credentials:
                  type: object
                  properties:
                    existingSecret:
                      type: string
                    postgresUser:
                      type: string
                    postgresPassword:
                      type: string
                    postgresDatabase:
                      type: string
                    llmExistingSecret:
                      type: string
                    llmApiKey:
                      type: string
                    llmBaseUrl:
                      type: string
                    llmModel:
                      type: string
                    cursorApiKey:
                      type: string
                    cursorModel:
                      type: string
                components:
                  type: object
                  properties:
                    harvester:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                    analyzer:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                    coreAi:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                    configurations:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                    reporter:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                    dashboard:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
            status:
              description: ShiftWiseStatus defines the observed state of ShiftWise.
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Initializing
                    - Progressing
                    - Ready
                    - Error
                readyComponents:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                message:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                      type:
                        type: string
---
apiVersion: v1
kind: Namespace
metadata:
  name: shiftwise-ai
  labels:
    app.kubernetes.io/name: shiftwise-operator
    app.kubernetes.io/part-of: kubeoptix
    app.kubernetes.io/managed-by: shiftwise-operator
    openshift.io/cluster-monitoring: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shiftwise-operator-controller-manager
  namespace: shiftwise-ai
  labels:
    app.kubernetes.io/name: shiftwise-operator
    app.kubernetes.io/part-of: kubeoptix
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shiftwise-operator-manager-role
  labels:
    app.kubernetes.io/name: shiftwise-operator
    app.kubernetes.io/part-of: kubeoptix
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts", "secrets", "configmaps", "persistentvolumeclaims", "events", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["build.openshift.io"]
    resources: ["buildconfigs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["shiftwise.ai"]
    resources: ["shiftwises", "shiftwises/status", "shiftwises/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shiftwise-operator-manager-rolebinding
  labels:
    app.kubernetes.io/name: shiftwise-operator
    app.kubernetes.io/part-of: kubeoptix
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shiftwise-operator-manager-role
subjects:
  - kind: ServiceAccount
    name: shiftwise-operator-controller-manager
    namespace: shiftwise-ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shiftwise-operator-leader-election-role
  namespace: shiftwise-ai
  labels:
    app.kubernetes.io/name: shiftwise-operator
    app.kubernetes.io/part-of: kubeoptix
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shiftwise-operator-leader-election-rolebinding
  namespace: shiftwise-ai
  labels:
    app.kubernetes.io/name: shiftwise-operator
    app.kubernetes.io/part-of: kubeoptix
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shiftwise-operator-leader-election-role
subjects:
  - kind: ServiceAccount
    name: shiftwise-operator-controller-manager
    namespace: shiftwise-ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shiftwise-operator-controller-manager
  namespace: shiftwise-ai
  labels:
    app.kubernetes.io/name: shiftwise-operator
    app.kubernetes.io/part-of: kubeoptix
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shiftwise-operator
      control-plane: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shiftwise-operator
        app.kubernetes.io/part-of: kubeoptix
        control-plane: controller-manager
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      serviceAccountName: shiftwise-operator-controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: quay.io/parraes/shiftwise-operator:0.2.1
          imagePullPolicy: IfNotPresent
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --leader-elect
          env:
            - name: WATCH_NAMESPACE
              value: ""
            - name: OPERATOR_NAME
              value: shiftwise-operator
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 10
