apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  name: shiftwise-operator.v0.1.0
  namespace: placeholder
  annotations:
    capabilities: Basic Install
    categories: AI/Machine Learning,OpenShift Optional
    containerImage: quay.io/parraes/shiftwise-operator-system:0.1.0
    createdAt: "2026-08-05T00:00:00Z"
    operators.operatorframework.io/suggested-namespace: shiftwise-operator-system
    alm-examples: |
      [
        {
          "apiVersion": "shiftwise.ai/v1alpha1",
          "kind": "ShiftWise",
          "metadata": {
            "name": "shiftwise",
            "namespace": "shiftwise-ai"
          },
          "spec": {
            "kubeoptix-harvester": {
              "namespace": {
                "create": true,
                "name": "shiftwise-ai"
              },
              "build": {
                "enabled": true,
                "source": {
                  "gitUri": "https://github.com/ShiftWise-AI/kubeoptix-harvester.git",
                  "gitRef": "main"
                },
                "sourceSecret": {
                  "create": false,
                  "name": "github-auth"
                }
              }
            },
            "kubeoptix-analyzer": {
              "namespace": {
                "create": false,
                "name": "shiftwise-ai"
              },
              "build": {
                "enabled": true,
                "source": {
                  "gitUri": "https://github.com/ShiftWise-AI/kubeoptix-analyzer.git",
                  "gitRef": "main"
                },
                "sourceSecret": {
                  "create": false,
                  "name": "github-auth"
                }
              }
            }
          }
        }
      ]
spec:
  displayName: ShiftWise Operator
  description: Operator Lua que reconcilia o stack KubeOptix completo, incluindo coleta, análise, configurações, relatórios, dashboard e PostgreSQL.
  keywords:
    - shiftwise
    - openshift
    - kubernetes
    - lua
    - aiops
  maintainers:
    - name: parraes
  provider:
    name: ShiftWise
  maturity: alpha
  minKubeVersion: 1.26.0
  version: 0.1.0
  links:
    - name: ShiftWise Operator
      url: https://github.com/ShiftWise-AI
  icon:
    - mediatype: image/svg+xml
      base64data: PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiBmaWxsPSIjMDA1YzVmIi8+PHRleHQgeD0iMzIiIHk9IjM4IiBmb250LXNpemU9IjE4IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSJ3aGl0ZSI+U1c8L3RleHQ+PC9zdmc+
  customresourcedefinitions:
    owned:
      - name: shiftwises.shiftwise.ai
        version: v1alpha1
        kind: ShiftWise
        displayName: ShiftWise
        description: Configuração declarativa para provisionar e monitorar todos os componentes KubeOptix.
  install:
    strategy: deployment
    spec:
      permissions: []
      clusterPermissions:
        - serviceAccountName: shiftwise-operator-controller-manager
          rules:
            - apiGroups: [""]
              resources: ["namespaces", "services", "serviceaccounts", "secrets", "configmaps", "persistentvolumeclaims", "events", "pods"]
              verbs: ["*"]
            - apiGroups: ["apps"]
              resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
              verbs: ["*"]
            - apiGroups: ["autoscaling", "batch"]
              resources: ["horizontalpodautoscalers", "jobs", "cronjobs"]
              verbs: ["*"]
            - apiGroups: ["rbac.authorization.k8s.io"]
              resources: ["clusterrolebindings"]
              verbs: ["*"]
            - apiGroups: ["route.openshift.io"]
              resources: ["routes"]
              verbs: ["*"]
            - apiGroups: ["build.openshift.io"]
              resources: ["buildconfigs"]
              verbs: ["*"]
            - apiGroups: ["image.openshift.io"]
              resources: ["imagestreams"]
              verbs: ["*"]
            - apiGroups: ["admissionregistration.k8s.io"]
              resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
              verbs: ["*"]
            - apiGroups: ["shiftwise.ai"]
              resources: ["shiftwises", "shiftwises/status", "shiftwises/finalizers"]
              verbs: ["*"]
      deployments:
        - name: shiftwise-operator-controller-manager
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: shiftwise-operator
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: shiftwise-operator
              spec:
                serviceAccountName: shiftwise-operator-controller-manager
                containers:
                  - name: manager
                    image: quay.io/parraes/shiftwise-operator-system:0.1.0
                    imagePullPolicy: IfNotPresent
                    env:
                      - name: WATCH_NAMESPACE
                        value: ""
                      - name: OPERATOR_NAME
                        value: shiftwise-operator
                      - name: POD_NAME
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.name
                      - name: POD_NAMESPACE
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.namespace
                    resources:
                      requests:
                        cpu: 100m
                        memory: 128Mi
                      limits:
                        cpu: 500m
                        memory: 512Mi
  installModes:
    - type: OwnNamespace
      supported: true
    - type: SingleNamespace
      supported: true
    - type: MultiNamespace
      supported: false
    - type: AllNamespaces
      supported: true
