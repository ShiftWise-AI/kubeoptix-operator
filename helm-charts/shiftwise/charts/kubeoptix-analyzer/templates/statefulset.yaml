{{- if .Values.deploy.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kubeoptix-analyzer.fullname" . }}
  namespace: {{ include "kubeoptix-analyzer.namespace" . }}
  labels:
    {{- include "kubeoptix-analyzer.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.service.headless.name }}
  # This workload is intentionally single-instance.
  replicas: 1
  selector:
    matchLabels:
      {{- include "kubeoptix-analyzer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubeoptix-analyzer.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kubeoptix-analyzer.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      containers:
        - name: kubeoptix-analyzer
          image: "{{ include "kubeoptix-analyzer.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.startup.loginWithServiceAccount }}
          command:
            - /bin/sh
            - -c
          args:
            - |
{{ .Values.startup.script | indent 14 }}
          {{- end }}
          env:
            - name: HOME
              value: {{ .Values.podEnv.HOME | quote }}
            - name: KUBECONFIG
              value: {{ .Values.podEnv.KUBECONFIG | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.api.targetPort }}
              protocol: TCP
          {{- if .Values.probes.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: app-data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: {{ default .Values.persistence.name .Values.persistence.existingClaim }}
      {{- end }}
{{- end }}
