deploy:
  enabled: true

namespace:
  create: true
  name: shiftwise-ai

image:
  useBuildOutput: true
  repository: default-route-openshift-image-registry.apps-crc.testing/shiftwise-ai/kubeoptix-harvester
  tag: latest
  pullPolicy: Always

build:
  enabled: true
  registryHost: image-registry.openshift-image-registry.svc:5000
  imageStreamName: kubeoptix-harvester
  outputTag: latest
  containerfilePath: Containerfile
  source:
    gitUri: https://github.com/ShiftWise-AI/kubeoptix-harvester.git
    gitRef: main
    contextDir: ""
  sourceSecret:
    create: true
    name: "github-auth"
    username: ""
    token: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: kubeoptix-harvester
  automountServiceAccountToken: true

rbac:
  createClusterRoleBinding: true
  clusterRoleName: cluster-reader

service:
  headless:
    enabled: true
    name: harvester
    port: 8000
  api:
    enabled: true
    name: harvester-api
    type: ClusterIP
    port: 8000
    targetPort: 8000

route:
  enabled: true
  name: harvester
  host: ""
  termination: edge
  insecureEdgeTerminationPolicy: Redirect

scalePolicy:
  enabled: true
  maxReplicas: 1

persistence:
  enabled: true
  existingClaim: ""
  name: harvester-app-data
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  mountPath: /app/data

podEnv:
  HOME: /tmp
  KUBECONFIG: /tmp/.kube/config

startup:
  loginWithServiceAccount: true
  script: |
    echo "[INFO] Authenticating with in-cluster service account"
    oc login https://kubernetes.default.svc:443 \
      --token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
      --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
      && \
    echo "[INFO] Starting API process" && \
    exec /app/.venv/bin/python /app/src/api.py

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2000m"
    memory: "4Gi"
