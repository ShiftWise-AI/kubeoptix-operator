apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shiftwises.shiftwise.ai
  labels:
    app.kubernetes.io/name: shiftwise-operator
    app.kubernetes.io/part-of: kubeoptix
spec:
  group: shiftwise.ai
  names:
    kind: ShiftWise
    listKind: ShiftWiseList
    plural: shiftwises
    singular: shiftwise
    shortNames:
      - sw
    categories:
      - shiftwise
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: string
          jsonPath: .status.readyComponents
        - name: Target
          type: string
          jsonPath: .spec.targetNamespace
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: ShiftWise is the Schema for the shiftwises API.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: ShiftWiseSpec defines the desired state of a ShiftWise platform instance.
              type: object
              properties:
                targetNamespace:
                  description: OpenShift project where KubeOptix components are created.
                  type: string
                  default: shiftwise-ai
                images:
                  type: object
                  properties:
                    harvester:
                      type: string
                    analyzer:
                      type: string
                    coreAi:
                      type: string
                    configurations:
                      type: string
                    reporter:
                      type: string
                    dashboard:
                      type: string
                    postgres:
                      type: string
                storage:
                  type: object
                  properties:
                    existingClaim:
                      type: string
                    name:
                      type: string
                    size:
                      type: string
                    storageClassName:
                      type: string
                    accessModes:
                      type: array
                      items:
                        type: string
                gitSource:
                  type: object
                  properties:
                    existingSecret:
                      type: string
                credentials:
                  type: object
                  properties:
                    existingSecret:
                      type: string
                    postgresUser:
                      type: string
                    postgresPassword:
                      type: string
                    postgresDatabase:
                      type: string
                    llmExistingSecret:
                      type: string
                    llmApiKey:
                      type: string
                    llmBaseUrl:
                      type: string
                    llmModel:
                      type: string
                    cursorApiKey:
                      type: string
                    cursorModel:
                      type: string
                components:
                  type: object
                  properties:
                    harvester:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                    analyzer:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                    coreAi:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                    configurations:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                    reporter:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                    dashboard:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
            status:
              description: ShiftWiseStatus defines the observed state of ShiftWise.
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Initializing
                    - Progressing
                    - Ready
                    - Error
                readyComponents:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                message:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                      type:
                        type: string
