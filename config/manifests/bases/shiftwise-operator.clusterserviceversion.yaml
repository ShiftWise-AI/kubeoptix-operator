apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  name: shiftwise-operator.v0.2.1
  namespace: placeholder
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "shiftwise.ai/v1alpha1",
          "kind": "ShiftWise",
          "metadata": {
            "name": "shiftwise",
            "namespace": "shiftwise-ai"
          },
          "spec": {
            "targetNamespace": "shiftwise-ai",
            "gitSource": {
              "existingSecret": "github-auth"
            },
            "storage": {
              "name": "harvester-app-data",
              "size": "10Gi",
              "accessModes": [
                "ReadWriteOnce"
              ]
            },
            "credentials": {
              "existingSecret": "kubeoptix-db",
              "llmExistingSecret": "llm"
            },
            "components": {
              "harvester": {
                "enabled": true
              },
              "analyzer": {
                "enabled": true
              },
              "coreAi": {
                "enabled": true
              },
              "configurations": {
                "enabled": true
              },
              "reporter": {
                "enabled": true
              },
              "dashboard": {
                "enabled": true
              }
            }
          }
        }
      ]
    capabilities: Basic Install
    categories: AI/Machine Learning,OpenShift Optional
    containerImage: quay.io/parraes/shiftwise-operator:0.2.1
    createdAt: "2026-08-31T00:00:00Z"
    description: ShiftWise operator that reconciles the KubeOptix platform on OpenShift.
    operators.operatorframework.io/suggested-namespace: shiftwise-ai
    repository: https://github.com/ShiftWise-AI/kubeoptix-operator
    support: ShiftWise AI
spec:
  displayName: ShiftWise Operator
  description: |
    Operador Kubernetes/OpenShift que reconcilia o CR ShiftWise na plataforma
    KubeOptix (Harvester, Analyzer, Core AI, Configurations, Reporter, Dashboard
    e PostgreSQL).
  keywords:
    - shiftwise
    - kubeoptix
    - openshift
    - kubernetes
    - aiops
  maintainers:
    - name: ShiftWise AI
  provider:
    name: ShiftWise AI
  maturity: alpha
  minKubeVersion: 1.26.0
  version: 0.2.1
  replaces: shiftwise-operator.v0.2.0
  links:
    - name: ShiftWise Operator
      url: https://github.com/ShiftWise-AI/kubeoptix-operator
  icon:
    - mediatype: image/png
      base64data: 
  installModes:
    - type: OwnNamespace
      supported: true
    - type: SingleNamespace
      supported: true
    - type: MultiNamespace
      supported: false
    - type: AllNamespaces
      supported: true
  customresourcedefinitions:
    owned:
      - name: shiftwises.shiftwise.ai
        version: v1alpha1
        kind: ShiftWise
        displayName: ShiftWise
        description: Instância da plataforma KubeOptix gerenciada pelo ShiftWise Operator.
  install:
    strategy: deployment
    spec:
      deployments: []
      permissions: []
      clusterPermissions: []
