{{- if and .Values.deploy.enabled .Values.rbac.createClusterRoleBinding }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeoptix-harvester.fullname" . }}-cluster-reader
  labels:
    {{- include "kubeoptix-harvester.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.rbac.clusterRoleName }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeoptix-harvester.serviceAccountName" . }}
    namespace: {{ include "kubeoptix-harvester.namespace" . }}
{{- end }}
